name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download depth model
        run: bash scripts/download_model.sh

      - name: Check model exists
        run: ls -lh app/src/main/assets/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Add launcher icons
        run: |
          R=app/src/main/res
          mkdir -p $R/drawable $R/values $R/mipmap-anydpi-v26
          cat > $R/values/ic_launcher_bg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_bg">#14142B</color>
          </resources>
          EOF
          cat > $R/drawable/ic_launcher_fg.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#3D3D8F" android:pathData="M18,76 L46,40 L64,62 L74,50 L90,76 Z"/>
              <path android:fillColor="#7C7CFF" android:pathData="M28,82 L52,52 L68,72 L76,62 L88,82 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M72,30 m-6,0 a6,6 0 1,0 12,0 a6,6 0 1,0 -12,0"/>
          </vector>
          EOF
          for n in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$n.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF
          done

      - name: Fix theme name
        run: |
          grep -rn "Theme.Material.NoTitleBar" app/src || true
          grep -rl "Theme.Material.NoTitleBar" app/src | xargs -r sed -i 's/Theme\.Material\.NoTitleBar/Theme.Material.NoActionBar/g'

      - name: Build debug APK
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --no-daemon --refresh-dependencies -Pandroid.injected.build.abi=arm64-v8a && exit 0
            echo "Attempt $i failed, retrying..."
            sleep 20
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ParallaxWallpaper-apk
          path: app/build/outputs/apk/debug/*.apk
