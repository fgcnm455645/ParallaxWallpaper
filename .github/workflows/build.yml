name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download depth model
        run: bash scripts/download_model.sh

      - name: Check model exists
        run: ls -lh app/src/main/assets/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Fix theme name
        run: |
          grep -rn "Theme.Material.NoTitleBar" app/src || true
          grep -rl "Theme.Material.NoTitleBar" app/src | xargs -r sed -i 's/Theme\.Material\.NoTitleBar/Theme.Material.NoActionBar/g'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -Pandroid.injected.build.abi=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: ParallaxWallpaper-apk
          path: app/build/outputs/apk/debug/*.apk
